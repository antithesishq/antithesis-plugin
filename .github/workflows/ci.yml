name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Nightly, to catch what changes outside the repo: links, the docs, the latest snouty.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# CI never releases, whatever version main is at. Pushing a `v*` tag runs release.yml.
jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # One stable check name for branch protection to require, whatever tasks exist.
  check:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          [ "${{ needs.checks.result }}" = success ]
