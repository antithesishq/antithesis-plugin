name: Release PR

# Every weekday at 17:00 GMT-7, opens a PR that releases the default branch's head, when its
# CI passed and the plugin changed since the last release. Claude picks the version and
# writes the notes by following the release skill, and the PR is assigned for review. Once
# it merges, tag-release.yml tags it and runs release.yml.
on:
  schedule:
    # 00:00 UTC, Tuesday to Saturday, is 17:00 GMT-7, Monday to Friday, all year round.
    - cron: "0 0 * * 2-6"
  workflow_dispatch:

concurrency:
  group: release-pr

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To dispatch CI on the release branch.
      actions: write
      # Claude authenticates to the Claude API with the workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The release skill reads the diff since the last tag.
          fetch-depth: 0
          # Claude works in this checkout and must not push: release-pr.py pushes.
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: uv
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-pr.py gate
      - id: claude
        if: steps.gate.outputs.release == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          # Workload identity federation: identifiers, not credentials. See the Claude
          # Console, under Settings, Workload identity.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: |
            You're preparing a release of the Antithesis plugin, unattended, in GitHub Actions.
            Read `.claude/skills/release/SKILL.md`, and follow only its "Pick and check the
            version", "Write the notes" and "Bump the version" sections. Pick the version
            yourself, and never a release candidate.

            Change only `CHANGELOG.md` and the files `scripts/set-version.py` writes. Don't
            create a branch, commit, push or open a PR: the workflow does that from your
            changes to the working tree.

            Answer with the version, and the reason: one or two sentences, for the PR body,
            on why you picked it. If a check fails, change nothing, and answer with an empty
            version and the failure as the reason.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git tag -l:*),Bash(git fetch:*),Bash(git rev-parse:*),Bash(grep:*),Bash(head:*),Bash(gh release view:*),Bash(gh repo view:*),Bash(scripts/set-version.py:*),Bash(scripts/changelog-section.py:*)"
            --json-schema '{"type":"object","properties":{"version":{"type":"string"},"reason":{"type":"string"}},"required":["version","reason"]}'
      - if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ fromJSON(steps.claude.outputs.structured_output).version }}
          REASON: ${{ fromJSON(steps.claude.outputs.structured_output).reason }}
          PREVIOUS: ${{ steps.gate.outputs.previous }}
          RELEASE_REVIEWER: carlsverre
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error title=No release::$REASON"
            exit 1
          fi
          scripts/release-pr.py open "$VERSION"
