name: Release PR

# Every weekday at 17:00 GMT-7, opens a PR that releases the default branch's head, when its
# CI passed and the plugin changed since the last release. Claude picks the version and
# writes the notes by following the release skill, and the PR is assigned for review. Once
# it merges, tag-release.yml tags it and runs release.yml.
#
# Claude reads text that others wrote, such as merged diffs, so its job can't write to the
# repository and can't reach the network beyond GitHub's API. It hands back only the version,
# its reason and the notes, and a separate job checks them and opens the PR from a clean
# checkout, so nothing Claude could have changed runs with a write token.
on:
  schedule:
    # 00:00 UTC, Tuesday to Saturday, is 17:00 GMT-7, Monday to Friday, all year round.
    - cron: "0 0 * * 2-6"
  workflow_dispatch:
  # TEMPORARY: test from the PR branch, which opens a real release PR. The federation rule
  # admits this branch for now. Remove before merging, and point the rule back at main.
  push:
    branches: [daily-release-workflow]

concurrency:
  group: release-pr

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      previous: ${{ steps.gate.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: uv
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-pr.py gate

  notes:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Claude authenticates to the Claude API with the workflow's OIDC token.
      id-token: write
    outputs:
      version: ${{ fromJSON(steps.claude.outputs.structured_output).version }}
      reason: ${{ fromJSON(steps.claude.outputs.structured_output).reason }}
      notes: ${{ fromJSON(steps.claude.outputs.structured_output).notes }}
      # The commit Claude read, so the PR releases exactly that.
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release skill reads the diff since the last tag.
          fetch-depth: 0
          persist-credentials: false
      - id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: uv
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          # Workload identity federation: identifiers, not credentials. The rule, in the
          # Claude Console under Settings, Workload identity, accepts only the schedule and
          # workflow_dispatch events on refs/heads/main of this repository.
          anthropic_federation_rule_id: fdrl_01Us1LZr8HnSXM1C8ucSFNK6
          anthropic_organization_id: 93f004c5-9d07-4352-b0d1-1730ec1c4b28
          anthropic_service_account_id: svac_01T1yc3UbfvpQnE3KLTfJ6bB
          anthropic_workspace_id: wrkspc_01J1wcfqkKJ5ey1wBmqnYb9D
          prompt: |
            You're preparing a release of the Antithesis plugin, unattended, in GitHub Actions.
            Read `.claude/skills/release/SKILL.md`, and do what its "Pick and check the
            version" and "Write the notes" sections say. Pick the version yourself, and never
            a release candidate. The workflow already checked that no release PR is open.

            Don't change any file: you can't, and the workflow writes `CHANGELOG.md` and sets
            the version. Instead, answer with:

            - version: the version you picked
            - reason: one or two sentences, for the PR body, on why you picked it
            - notes: the body of the version's `CHANGELOG.md` section, without its
              `# Version` heading

            If a check fails, answer with an empty version, and the failure as the reason.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git tag -l:*),Bash(git rev-parse:*),Bash(grep:*),Bash(head:*),Bash(gh release view:*),Bash(gh repo view:*)"
            --json-schema '{"type":"object","properties":{"version":{"type":"string"},"reason":{"type":"string"},"notes":{"type":"string"}},"required":["version","reason","notes"]}'

  pr:
    needs: [gate, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To dispatch CI on the release branch.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.notes.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: uv
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
          REASON: ${{ needs.notes.outputs.reason }}
          NOTES: ${{ needs.notes.outputs.notes }}
          PREVIOUS: ${{ needs.gate.outputs.previous }}
          RELEASE_REVIEWER: carlsverre
        run: scripts/release-pr.py open "$VERSION"
