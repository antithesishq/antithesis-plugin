name: Checks

# Runs every check. CI calls it for pull requests and main, and Release calls it for a tag.
on:
  workflow_call:

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  # Every `check:*` task in mise.toml becomes its own job, and so its own GitHub check.
  tasks:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install: false
      - id: list
        run: echo "checks=$(mise tasks ls --json | jq -c '[.[].name | select(startswith("check:"))]')" >> "$GITHUB_OUTPUT"

  checks:
    needs: tasks
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    # After the pull request passed, an external link that's briefly down shouldn't fail
    # main or block a release. A tag push is also a push.
    continue-on-error: ${{ github.event_name == 'push' && matrix.task == 'check:lychee' }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.tasks.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # check:tokens compares token counts with the pull request's base.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
      - name: Install the latest snouty
        if: matrix.task == 'check:docs'
        # The installer adds snouty to GITHUB_PATH for the next steps.
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/antithesishq/snouty/releases/latest/download/snouty-installer.sh | sh
      - name: mise run ${{ matrix.task }}
        run: mise run ${{ matrix.task }}
        env:
          GH_TOKEN: ${{ github.token }}
          # lychee uses this to avoid GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          TOKEN_BASE: ${{ github.event.pull_request.base.sha }}
          # Unprefixed output, so `::error` annotations start their lines.
          MISE_TASK_OUTPUT: interleave
