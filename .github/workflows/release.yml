name: Release

# Tagging the merged release PR's commit on main runs this: a pushed tag starts it, and
# tag-release.yml, whose tag push can't, dispatches it on the tag. Nothing else releases: a
# version bump on main alone does not, and verify rejects a dispatch on anything but a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  # Release only a tag on a commit of the default branch, whose manifests and changelog
  # are at the tag's version, and that isn't released yet.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: uv
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/verify-release.py "$GITHUB_REF_NAME" "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

  checks:
    needs: verify
    uses: ./.github/workflows/checks.yml

  release:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: uv
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          # A release candidate, vX.Y.Z-rc.N, is a GitHub pre-release.
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          scripts/changelog-section.py "$VERSION" > notes.md
          # --target only records the commit: without it, GitHub records the default branch.
          gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --prerelease="$PRERELEASE"
